[project]
name = "eigenflow"
version = "0.3.0"
description = "PennyLane + JAX drop-in layers for classical and quantum ML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "optax>=0.1.0",
    "pennylane>=0.30.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
    "isort>=5.12.0",
]
catalyst = [
    "pennylane-catalyst>=0.8.0",
    "pennylane-lightning>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eigenflow"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["eigenflow", "experiments", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "catalyst: tests that require pennylane-catalyst / lightning",
]
addopts = [
    "--verbose",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["eigenflow"]

[tool.coverage.run]
source = ["eigenflow"]
omit = ["tests/*", "experiments/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
